name: iOS build

on:
  push:
    paths: ['RunnerGame/**', '.github/workflows/ios-build.yml']
  pull_request:
    paths: ['RunnerGame/**']
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        working-directory: RunnerGame
        run: xcodegen generate
      - name: Build and test on iOS Simulator
        working-directory: RunnerGame
        run: |
          set -o pipefail
          UDID=$(xcrun simctl list devices available | grep -m1 "iPhone" | grep -oE '[0-9A-F]{8}-([0-9A-F]{4}-){3}[0-9A-F]{12}')
          echo "Simulator: $UDID"
          xcodebuild test \
            -project Runner.xcodeproj \
            -scheme Runner \
            -destination "id=$UDID" \
            CODE_SIGNING_ALLOWED=NO > build.log 2>&1 || true
          grep -E "error:|Test Case.*(passed|failed)|Executed|TEST (SUCCEEDED|FAILED)|BUILD" build.log | head -80
          grep -q "TEST SUCCEEDED" build.log
